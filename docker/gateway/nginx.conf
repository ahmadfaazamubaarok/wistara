# Gerbang kecil agar URL Auth lokal berbentuk sama seperti di Supabase:
#   <SUPABASE_URL>/auth/v1/...  ->  GoTrue di auth:9999/...
# Di produksi, SUPABASE_URL langsung menunjuk proyek Supabase dan gerbang ini tidak dipakai.
server {
  listen 54321;
  server_name _;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    return 200 "ok\n";
  }
}
