# Lingkungan pengembangan JelajahLokal. Identik di Windows (Docker Desktop)
# dan Ubuntu (Docker Engine): `docker compose up --build`.
#
# `name` dipaku agar nama container dan volume sama di komputer siapa pun,
# apa pun nama folder tempat repository di-clone.
name: wistara

services:
  app:
    build:
      context: .
      target: dev
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    init: true # tini: sinyal Ctrl+C diteruskan benar dan tidak ada proses zombie
    # Migrasi diterapkan otomatis tiap start, jadi `git pull` + restart sudah cukup.
    # Data seed dimuat hanya bila tabel destinations masih kosong (pakai `npm run db:seed` untuk memuat ulang).
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed -- --if-empty && exec npm run dev:docker"]
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      # Produksi (Vercel) berjalan di UTC. Dev dipaksa UTC juga supaya bug zona
      # waktu muncul di laptop, bukan saat demo. Tampilan WIB dikonversi
      # eksplisit lewat src/lib/wib.ts.
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: "1"
      # Bind mount dari NTFS (Windows) tidak meneruskan event inotify ke
      # container, jadi hot reload memakai polling. Angka = interval (ms);
      # nilai `true` berarti ~5 detik.
      WATCHPACK_POLLING: "1000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-wistara}:${POSTGRES_PASSWORD:-wistara_dev}@db:5432/${POSTGRES_DB:-jelajahlokal}"
      NEXT_PUBLIC_MAP_STYLE_URL: "${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/positron}"
      NEXT_ALLOWED_DEV_ORIGINS: "${NEXT_ALLOWED_DEV_ORIGINS:-}"
      CRON_SECRET: "${CRON_SECRET:-dev-only-cron-secret}"
      BMKG_API_BASE_URL: "${BMKG_API_BASE_URL:-}"
      # Wistara AI: kosong = fitur AI mati, mesin tanpa model tetap jalan.
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_RATE_GUEST_PER_HOUR: "${AI_RATE_GUEST_PER_HOUR:-20}"
      AI_RATE_USER_PER_HOUR: "${AI_RATE_USER_PER_HOUR:-60}"
      AI_DAILY_LIMIT: "${AI_DAILY_LIMIT:-500}"
      # Auth (setara Supabase Auth). Hanya SERVER yang menghubungi layanan ini; browser tidak
      # pernah, jadi CSP tidak perlu mengizinkan domain Supabase. Kunci anon di bawah ditandatangani
      # dengan AUTH_JWT_SECRET dev dan BUKAN rahasia. Di produksi, isi dari dashboard Supabase.
      SUPABASE_URL: "${SUPABASE_URL:-http://gateway:54321}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImplbGFqYWhsb2thbC1kZXYiLCJpYXQiOjE3NjAwMDAwMDAsImV4cCI6NDEwMjQ0NDgwMH0.M9fCn6dyI8-M5Rf251QB5OSEGSmf6rGU6SYLdBJdZaY}"
    volumes:
      - .:/app # kode sumber: edit di host, langsung terlihat di container
      - node_modules:/app/node_modules # biner Linux, tidak bercampur dengan host
      - next_cache:/app/.next # cache build di volume = jauh lebih cepat di Windows
    depends_on:
      db:
        condition: service_healthy
      # Migrasi trips mereferensi auth.users, yang dibuat GoTrue saat pertama berjalan.
      auth:
        condition: service_healthy

  db:
    # PostgreSQL + PostGIS (skema proyek memakainya). Samakan versi mayor
    # dengan proyek Supabase tim bila berbeda.
    image: postgis/postgis:17-3.5
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-wistara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wistara_dev}
      POSTGRES_DB: ${POSTGRES_DB:-jelajahlokal}
    ports:
      # Hanya loopback: basis data dev berkata sandi lemah tidak boleh terbuka
      # ke jaringan kampus/kafe.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skrip init meniru bagian Supabase (schema extensions/auth, role anon dll.).
      # Hanya berjalan saat volume pgdata pertama kali dibuat.
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # GoTrue = perangkat lunak yang sama dengan Supabase Auth. Mendaftar dan login dengan
  # email + kata sandi; konfirmasi email dimatikan di lokal (di Supabase produksi tetap aktif).
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_SITE_URL: "http://localhost:${APP_PORT:-3000}"
      GOTRUE_DB_DRIVER: postgres
      DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:auth_dev_password@db:5432/${POSTGRES_DB:-jelajahlokal}?search_path=auth"
      GOTRUE_JWT_SECRET: "${AUTH_JWT_SECRET:-dev-only-jwt-secret-at-least-32-characters-long}"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@jelajahlokal.test
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: "2500"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Menambahkan awalan /auth/v1 agar URL lokal berbentuk sama seperti Supabase.
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:54321:54321" # port bawaan Supabase CLI; hanya loopback
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  node_modules:
  next_cache:
  pgdata:
